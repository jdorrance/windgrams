# Durable copy of first-issued history in release assets, outside Actions caches
# and short-lived artifacts, at no recurring cost (public-repo release storage).
# The pre-release tag `issued-history` is a backup target, not a software release.
name: Backup issued history
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      restore:
        description: Restore history from the backup release when the cache has lost it
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: backup-history
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Reserve forecast workspace
        run: node scripts/prepare-refresh-runner.mjs pages
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: forecasts/data
          key: issued-data-v2-${{ github.run_id }}
          restore-keys: |
            issued-data-v2-
            forecast-data-
      - name: Restore history from the backup release
        if: inputs.restore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p backup-download
          gh release download issued-history --repo "$GITHUB_REPOSITORY" --dir backup-download --pattern 'history-backup-manifest.json' --pattern 'issued-history.tar.part-*'
          node forecasts/scripts/backup-issued-history.mjs restore --archive backup-download --output forecasts/data/history
      - name: Compact retained issued history
        run: node forecasts/verification/compact-history.mjs --data forecasts/data
      - name: Pack and verify the durable backup
        run: node forecasts/scripts/backup-issued-history.mjs pack --history forecasts/data/history --output backup
      - name: Upload the backup to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view issued-history --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create issued-history --repo "$GITHUB_REPOSITORY" --prerelease --title "Issued-history backup" --notes "Automated durable backup of first-issued forecast history. Restore with forecasts/scripts/backup-issued-history.mjs; see forecasts/docs/operations.md."
          gh release upload issued-history --repo "$GITHUB_REPOSITORY" --clobber backup/history-backup-manifest.json backup/issued-history.tar.part-*
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: success()
        with:
          path: forecasts/data
          key: issued-data-v2-${{ github.run_id }}
