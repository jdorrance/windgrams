# Offline checks for pull requests and main. Live upstream probes run separately.
name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm run check:workflows
      - run: pnpm run check:boundaries
      - run: pnpm run check:api
      - name: Offline tests and kernel coverage
        run: pnpm run test:coverage
      - run: pnpm run test:consumer

  icon-decoder:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: forecasts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned native ICON decoder
        run: |
          python3.12 -m venv .venv-icon
          .venv-icon/bin/pip install --disable-pip-version-check -r scripts/lib/icon-requirements.txt
      - name: Offline native decoder tests
        run: .venv-icon/bin/python scripts/lib/icon-decode.test.py

  forecasts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: forecasts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: Validate sites.json
        run: pnpm run check
      - name: Backend type checks
        run: pnpm run check:types
      - name: Engine dry run
        run: node scripts/check-engines.mjs

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: Type checks
        run: pnpm run check
      - name: Sample dataset
        # Every launch's model profiles are validated; synthetic terrain is exercised
        # at western and eastern US launches without rebuilding every tile pyramid.
        run: pnpm run dev-data --solar-site wa-blanchard --solar-site va-woodstock
      - name: Build
        run: pnpm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Offline browser checks
        run: pnpm --dir web test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: browser-failures
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7
