# Short serialized publication. Provider refreshes complete independently.
name: Pages
on:
  workflow_run:
    workflows: [Refresh noaa-cloud, Refresh rrfs, Refresh dwd, Refresh eccc, Refresh observations, Refresh terrain]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh providers, or publish completed artifacts
        type: choice
        required: true
        default: all
        options: [all, rrfs, icon-eu, none]
      dry_run:
        description: Validate collected artifacts without deployment
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.package.json"
      - "web/**"
      - "forecasts/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/refresh*.yml"
      - ".github/actions/setup-pnpm/**"
permissions:
  contents: read
jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' && inputs.refresh != 'none' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFRESH: ${{ inputs.refresh }}
        run: node scripts/dispatch-refresh.mjs "$REFRESH"

  publish:
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.refresh == 'none' || inputs.dry_run) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: ./.github/actions/setup-pnpm
      - id: urls
        env:
          WINDGRAMS_SITE: ${{ vars.WINDGRAMS_SITE }}
          WINDGRAMS_BASE: ${{ vars.WINDGRAMS_BASE }}
          WINDGRAMS_DATA_BASE: ${{ vars.WINDGRAMS_DATA_BASE }}
        run: node scripts/pages-config.mjs
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: forecasts/data
          key: forecast-data-${{ github.run_id }}
          restore-keys: forecast-data-
      - name: Seed the last complete publication
        working-directory: forecasts
        env:
          METEO_DATA_BASE: ${{ steps.urls.outputs.data }}
        run: node scripts/seed-published.mjs --output data --from "$METEO_DATA_BASE" --all --best-effort
      - name: Collect completed provider artifacts
        run: node scripts/collect-refresh-artifacts.mjs incoming
      - name: Validate publication candidates
        if: inputs.dry_run
        run: node forecasts/scripts/prepare-publication.mjs --incoming incoming --output forecasts/data --dry-run
      - name: Merge and validate publication
        if: ${{ !inputs.dry_run }}
        run: node forecasts/scripts/prepare-publication.mjs --incoming incoming --output forecasts/data
      - name: Build site
        if: ${{ !inputs.dry_run }}
        working-directory: web
        env:
          WINDGRAMS_SITE: ${{ steps.urls.outputs.site }}
          WINDGRAMS_BASE: ${{ steps.urls.outputs.base }}
          PUBLIC_WINDGRAMS_DATA_BASE: ${{ vars.WINDGRAMS_DATA_BASE }}
        run: pnpm run build
      - name: Assemble and measure Pages artifact
        if: ${{ !inputs.dry_run }}
        run: node scripts/prepare-pages.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        if: ${{ !inputs.dry_run }}
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        if: ${{ !inputs.dry_run }}
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        if: ${{ !inputs.dry_run }}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ success() && !inputs.dry_run }}
        with:
          path: forecasts/data
          key: forecast-data-${{ github.run_id }}
