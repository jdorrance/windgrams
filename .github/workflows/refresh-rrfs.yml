# Each completion can publish independently of slower providers.
name: Refresh rrfs
on:
  push:
    branches: [main]
    paths: [forecasts/sites.json]
  schedule:
    - cron: "55 3,9,15,21 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  refresh:
    uses: ./.github/workflows/refresh-provider.yml
    with:
      group: rrfs
